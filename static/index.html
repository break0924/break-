<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>好友德州局</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">德州扑克好友局 MVP</p>
          <h1>扫码进房，和朋友一起玩</h1>
          <p class="sub">创建房间、邀请好友、实时同步牌局、自动结算。</p>
        </div>
        <div class="card setup-card">
          <label>你的昵称</label>
          <input id="name" maxlength="20" placeholder="例如：阿强" />
          <label>房间号</label>
          <input id="roomId" maxlength="12" placeholder="创建后或扫码进入" />
          <div class="row">
            <button id="createBtn">创建房间</button>
            <button id="joinBtn" class="secondary">加入房间</button>
          </div>
          <p id="shareHint" class="hint"></p>
        </div>
      </section>

      <section class="board">
        <div class="panel table-panel">
          <div class="panel-head">
            <h2>牌桌</h2>
            <span id="statusBadge">等待中</span>
          </div>

          <div id="message" class="message">先创建或加入一个房间。</div>

          <div class="table-scene">
            <div class="table-felt">
              <div class="table-core">
                <div class="pot-badge">
                  <span>底池</span>
                  <strong id="pot">0</strong>
                </div>
                <div class="community-area">
                  <div class="label small-label">公共牌</div>
                  <div id="community" class="cards cards-community"></div>
                </div>
                <div class="community-area hand-area">
                  <div class="label small-label">你的手牌</div>
                  <div id="hole" class="cards cards-hand"></div>
                </div>
                <div class="table-info">
                  <div><span>阶段</span><strong id="phase">等待</strong></div>
                  <div><span>当前行动</span><strong id="turnPlayer">-</strong></div>
                </div>
              </div>
              <div id="seats" class="seat-ring"></div>
            </div>
          </div>
        </div>

        <aside class="panel sidebar-panel">
          <div class="panel-head">
            <h2>操作区</h2>
            <span id="roomLabel">未加入</span>
          </div>
          <div class="share-card" id="shareCard">
            <div class="share-head">
              <div>
                <div class="share-title">微信扫码进房</div>
                <div class="share-sub">扫码后自动带房间号进入</div>
              </div>
              <button id="copyLinkBtn" class="secondary small-btn">复制链接</button>
            </div>
            <img id="roomQr" class="room-qr" alt="房间二维码" />
            <div id="shareUrl" class="share-url"></div>
          </div>
          <div class="actions actions-stack">
            <button id="startBtn">开局</button>
            <button data-action="check" class="secondary">过牌</button>
            <button data-action="call" class="secondary">跟注</button>
            <button data-action="fold" class="secondary danger">弃牌</button>
            <div class="raise-box">
              <input id="raiseAmount" type="number" min="1" step="1" value="20" />
              <button id="raiseBtn" class="secondary">加注</button>
            </div>
          </div>
          <div class="divider"></div>
          <h3>桌上玩家</h3>
          <div id="players" class="players compact-players"></div>
        </aside>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
